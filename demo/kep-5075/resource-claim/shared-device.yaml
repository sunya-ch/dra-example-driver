# This demo verifies single device can be shared among multiple resource claims.
# Expected result: two pods running
apiVersion: v1
kind: Namespace
metadata:
  name: shared-device1
---
apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaimTemplate
metadata:
  namespace: shared-device1
  name: single-shared-nic
spec:
  spec:
    devices:
      requests:
      - name: nic
        deviceClassName: shared.device.x-k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  namespace: shared-device1
  name: pod0
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["export; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: nic
  resourceClaims:
  - name: nic
    resourceClaimTemplateName: single-shared-nic
---
apiVersion: v1
kind: Pod
metadata:
  namespace: shared-device1
  name: pod1
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["export; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: nic
  resourceClaims:
  - name: nic
    resourceClaimTemplateName: single-shared-nic
