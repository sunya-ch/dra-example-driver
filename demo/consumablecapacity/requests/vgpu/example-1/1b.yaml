apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-tinyllama-1b
spec:
  replicas: 0
  selector:
    matchLabels:
      app: vllm-tinyllama-1b
  template:
    metadata:
      labels:
        app: vllm-tinyllama-1b
    spec:
      containers:
      - args:
        - --model
        - TinyLlama/TinyLlama_v1.1
        - --port
        - "8000"
        - --max-loras
        - "2"
        - --lora-modules
        - '{"name": "food-review-1"}'
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        imagePullPolicy: IfNotPresent
        name: vllm-sim
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          claims:
          - name: shared-gpu
      resourceClaims:
      - name: shared-gpu
        resourceClaimTemplateName: rc-1b-model

